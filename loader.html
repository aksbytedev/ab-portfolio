<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Fullscreen white background with centered content */
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        display: flex;
        flex-direction: column;       /* Stack vertically */
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Segoe UI', sans-serif;
      }

      /* Spinner style */
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #ccc;
        border-top: 4px solid #4285F4;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }

      /* Text style */
      .loader-text {
        font-size: 16px;
        color: #555;
        text-align: center;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Launching Akshya’s Portfolio...</div>
    </div>

    <script>
      // Remove loader after Flutter app loads
      window.addEventListener('load', function () {
        const loader = document.getElementById('loader');
        if (loader) loader.remove();
      });
    </script>
  </body>
</html>
